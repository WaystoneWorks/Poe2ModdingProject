# B4 in WASD mode: clicks a waypoint and a checkpoint from near and far, and with a key held, so a
# click in reach reached from a WASD walk is covered. Cells as in `b4-interact.toml`. After a key walk the client's
# world position rests off its grid (up to about 1.7 cells), so those checks compare the grid: `same_cell`.
# With a key held and the object out of reach the client starts no `Interaction` and walks on: only the
# agreement at rest is checked there. "Key kept held": W stays down through a checkpoint click in reach
# (the checkpoint's area map does not take the keys, the waypoint's World panel does): the client waits
# for the `Interaction`'s 0.1 s and walks on. The walk passes 10 cells beside the checkpoint: it blocks
# (`blocking = true`), which the server's grid does not port yet.
description = "object clicks in WASD mode, also with a key held: no position correction"
input_mode = "wasd"

[server]
"dev.drift_check" = true
"dev.drift_interval_ms" = 100

[[step]]
name = "transfer to G1_town seed 1"
cmd = "transfer G1_town 1"

[[step]]
name = "in the new instance"
expect_log = "player entered the world"
since = "action"
timeout_s = 60

[[step]]
name = "in G1_town"
expect_state = { area = "G1_town" }
timeout_s = 60

[[step]]
name = "settled"
wait_ms = 3000

[[step]]
name = "waypoint near: teleport"
cmd = "teleport 290 258"

[[step]]
name = "waypoint near: there"
expect_state = { near = [290, 258, 4] }

[[step]]
name = "waypoint near: settle"
wait_ms = 800

[[step]]
name = "waypoint near: click"
click_cell = [282, 252]

[[step]]
name = "waypoint near: server saw it"
expect_log = "object clicked"
since = "action"
timeout_s = 8

[[step]]
name = "waypoint near: rest"
keys = "wait:1500"

[[step]]
name = "waypoint near: no correction at rest"
max_drift = 1

[[step]]
name = "waypoint near: close the panel"
keys = "0x1b wait:800"

[[step]]
name = "waypoint near: walk away with a key"
keys = "indown:0x57 wait:500 inup:0x57"

[[step]]
name = "waypoint near: walk rest"
wait_ms = 800

[[step]]
name = "waypoint near: walk rest window"
keys = "wait:500"

[[step]]
name = "waypoint near: no correction after the walk"
same_cell = true

