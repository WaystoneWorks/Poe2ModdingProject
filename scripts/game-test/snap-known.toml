# T1: a walk out of a checkpoint's ring. A teleport onto the G1_2 seed 1 checkpoint's own cell
# (630,1388) puts the player inside its blocking ring (a warp now arrives outside it, at (630,1381)).
# The client's path search hands a start inside an entity to the general A* 0x141edc7d0, which the
# server ports (clientpath.rs Search::astar), so the walk out must not snap. `after` passes when
# snaps.py finds no snap and unported.py sees the client run the A*.
description = "a walk out of a checkpoint's ring (the A* fallback) does not snap"
input_mode = "wasd"
after = ["python3 scripts/re/snaps.py {session}", "python3 scripts/re/unported.py {session} --expect astar_fallback", "python3 scripts/re/first_divergence.py {session} --config {dir}/server.toml --out {dir}/first-divergence --no-fail"]

[client_env]
POE_HOOK_MOVEMENT_LOG = "1"

[server]
"dev.drift_check" = true
"dev.drift_interval_ms" = 100


[[step]]
name = "transfer to G1_2 seed 1"
cmd = "transfer G1_2 1"

[[step]]
name = "in the new instance"
expect_log = "player entered the world"
since = "action"
timeout_s = 60

[[step]]
name = "in G1_2"
expect_state = { area = "G1_2" }
timeout_s = 60

[[step]]
name = "settled"
wait_ms = 3000

[[step]]
name = "teleport onto the checkpoint"
cmd = "teleport 630 1388"

[[step]]
name = "there"
expect_state = { near = [630, 1388, 2] }

[[step]]
name = "settle"
wait_ms = 800

[[step]]
name = "walk W out of the ring"
keys = "indown:0x57 wait:1200 inup:0x57 wait:600"

[[step]]
name = "walk D"
keys = "indown:0x44 wait:800 inup:0x44 wait:600"

[[step]]
name = "walk S"
keys = "indown:0x53 wait:800 inup:0x53 wait:1000"
