# B4: clicks a waypoint and a checkpoint from near and far, standing and moving, in mouse mode,
# and logs every drift line so each snap has a frame, a distance and a cause. Cells:
# `area_objects G1_town 1`, `area_objects G1_2 1`.
description = "object clicks from near, far and moving: no position correction"
input_mode = "mouse_and_keyboard"

[server]
"dev.drift_check" = true
"dev.drift_interval_ms" = 100

[[step]]
name = "transfer to G1_town seed 1"
cmd = "transfer G1_town 1"

[[step]]
name = "in the new instance"
expect_log = "player entered the world"
since = "action"
timeout_s = 60

[[step]]
name = "in G1_town"
expect_state = { area = "G1_town" }
timeout_s = 60

[[step]]
name = "settled"
wait_ms = 3000

[[step]]
name = "waypoint near: teleport"
cmd = "teleport 290 258"

[[step]]
name = "waypoint near: there"
expect_state = { near = [290, 258, 4] }

[[step]]
name = "waypoint near: settle"
wait_ms = 800

[[step]]
name = "waypoint near: click"
click_cell = [282, 252]

[[step]]
name = "waypoint near: server saw it"
expect_log = "object clicked"
since = "action"
timeout_s = 8

[[step]]
name = "waypoint near: rest"
keys = "wait:1500"

[[step]]
name = "waypoint near: no correction at rest"
max_drift = 1

[[step]]
name = "waypoint near: close the panel"
keys = "0x1b wait:800"

[[step]]
name = "waypoint near: walk away at once"
click_cell = [290, 258]

[[step]]
name = "waypoint near: walk away rest"
keys = "wait:1500"

[[step]]
name = "waypoint near: no correction after the walk away"
max_drift = 1

[[step]]
