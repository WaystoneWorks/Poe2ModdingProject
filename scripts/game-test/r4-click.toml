# P9: clicks a waypoint, a fog gate and a checkpoint (G1_town seed 1, then the G1_2 it leads to and
# G1_2 seed 1). Cells: `area_objects G1_town 1`, `area_objects G1_2 1`. Screenshots in the prefix.
description = "clicking travel objects: waypoint panel, gate transfer, checkpoint map"
input_mode = "mouse_and_keyboard"

[server]
"dev.drift_check" = true

[[step]]
name = "transfer to G1_town seed 1"
cmd = "transfer G1_town 1"

[[step]]
name = "in G1_town"
expect_state = { area = "G1_town" }
timeout_s = 60

[[step]]
name = "teleport near the waypoint"
cmd = "teleport 290 258"

[[step]]
name = "at the waypoint"
expect_state = { near = [290, 258, 4] }

[[step]]
name = "click the waypoint"
click_cell = [282, 252]
lift = 0

[[step]]
name = "server saw the click"
expect_log = "object clicked"
since = "action"
timeout_s = 8

[[step]]
name = "screenshot the panel"
keys = "wait:1500 0x77 wait:500"

[[step]]
name = "close the panel"
keys = "0x1b wait:800"

[[step]]
name = "teleport near a gate"
cmd = "teleport 328 205"

[[step]]
name = "at the gate"
expect_state = { near = [328, 205, 4] }

[[step]]
name = "screenshot before the gate click"
keys = "wait:800 0x77 wait:300"

[[step]]
name = "click the gate"
click_cell = [324, 189]
lift = 60

[[step]]
name = "server saw the gate click"
expect_log = "object clicked"
since = "action"
timeout_s = 8

[[step]]
name = "in G1_2 by the gate"
expect_state = { area = "G1_2" }
timeout_s = 60

[[step]]
name = "transfer to G1_2 seed 1"
cmd = "transfer G1_2 1"

# Already in G1_2 (the gate): the area check alone passes before the new instance loads.
[[step]]
name = "in the new instance"
expect_log = "player entered the world"
since = "action"
timeout_s = 60

[[step]]
name = "in G1_2"
expect_state = { area = "G1_2" }
timeout_s = 60

[[step]]
name = "teleport to a checkpoint"
cmd = "teleport 640 1375"

[[step]]
name = "at the checkpoint"
expect_state = { near = [640, 1375, 4] }

[[step]]
name = "click the checkpoint"
click_cell = [630, 1388]
lift = 80

[[step]]
name = "server saw the checkpoint click"
expect_log = "object clicked"
since = "action"
timeout_s = 8

[[step]]
name = "screenshot the area map"
keys = "wait:1500 0x77 wait:500"

[[step]]
name = "no server errors"
reject_log = " ERROR "
