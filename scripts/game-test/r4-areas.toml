# P9: every area (seed 1) whose travel objects are not the plain captured types: gates, waypoints
# and checkpoints sent as their own type, substituted types (G1_8's ExitTransition_Mausoleum, G2_6's
# Toggleable and AncientSeal portals). List from `python3 scripts/travel-survey.py`. A client
# BufferUnderflow keeps the area at "". Each loading screen ends before the next transfer: a
# transfer during it closes the client.
description = "areas with special travel objects load with their objects (seed 1)"
input_mode = "wasd"

[[step]]
name = "transfer to G1_8 seed 1"
cmd = "transfer G1_8 1"

[[step]]
name = "in G1_8"
expect_state = { area = "G1_8" }
timeout_s = 120

[[step]]
name = "G1_8 loading screen over"
expect_log = "\\[LOADING SCREEN\\]"
log = "client"
since = "action"
timeout_s = 90

