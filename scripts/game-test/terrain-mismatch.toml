# Terrain mismatch (PLAN P4): `dev.fake_terrain_hash` makes the server expect a wrong tile hash
# in every generated area. The test character starts in G1_8, which mismatches: no previous
# instance, so the player lands in the town (the DLL exports the client's layout and shows the
# popup, screenshot). A transfer to G1_1 from the town mismatches again (more than 60 s later) and
# goes back to the town instance; a second one within 60 s ends at character select. Format: docs/guides/setup.md.
description = "forced terrain mismatch: popup and layout export, no previous instance goes to the town, then back to the previous instance, a second one in a row to character select"

setup = [
  "rm -f runtime/game-test/terrain_mismatches.tsv",
  "db=$(sed -n 's/^path = \"\\(.*\\)\"/\\1/p' \"$CFG\" | head -1); sqlite3 \"$db\" \"UPDATE characters SET area='G1_8', seed=NULL, pos_x=NULL, pos_y=NULL WHERE account_id=(SELECT id FROM accounts WHERE name='$ACCT')\"",
]
after = [
  "find {session} dumps/0.5.5e.hotfix1/terrain/area-exports -name 'terrain_layout_G1_8_*_client*_server*.tsv' 2>/dev/null | grep -q . && echo client layout exported",
  "find {session} dumps/0.5.5e.hotfix1/terrain/area-exports -name 'terrain_grid_G1_8_*_client*.bin' 2>/dev/null | grep -q . && echo client grid exported",
  "cp \"$(ls -t {session}/snapshots/*/*.png | head -1)\" runtime/game-test/terrain-mismatch.png && echo screenshot runtime/game-test/terrain-mismatch.png",
  "grep -c '^' runtime/game-test/terrain_mismatches.tsv",
]
[server]
"dev.fake_terrain_hash" = true
"terrain.mismatch_log" = "runtime/game-test/terrain_mismatches.tsv"

[[step]]
name = "server found the mismatch (G1_8, no previous instance)"
expect_log = "terrain mismatch: terrain-mismatch build=0.5.5e.hotfix1"
since = "start"
timeout_s = 120

[[step]]
name = "first kick goes to the town"
expect_log = "dest=town G1_town"
since = "start"

[[step]]
name = "DLL exported the layout and acknowledged"
expect_log = "DLL: ack export"
since = "start"
timeout_s = 20

[[step]]
name = "DLL shows the popup"
expect_log = "alert: Terrain does not match the server"
log = "hook"
since = "start"
timeout_s = 20

[[step]]
name = "in the town"
expect_state = { area = "G1_town" }
timeout_s = 120

[[step]]
name = "snapshot of the popup (it stays through the reload)"
keys = "wait:3000 0x24 wait:3000"

[[step]]
name = "wait out the 60 s loop guard"
wait_ms = 65000

[[step]]
name = "transfer to G1_1 seed 1 (second mismatch)"
cmd = "transfer G1_1 1"

[[step]]
name = "second kick goes back to the previous instance"
expect_log = "dest=previous instance"
timeout_s = 120

[[step]]
name = "in the town again"
expect_state = { area = "G1_town" }
timeout_s = 120

[[step]]
name = "transfer to G1_1 again (mismatch in a row)"
cmd = "transfer G1_1 1"

[[step]]
name = "third kick goes to character select"
expect_log = "dest=character select"
timeout_s = 120

[[step]]
name = "no server errors"
reject_log = " ERROR "
